name: k4-r4-agent-skill-package-evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/k4-r4-agent-skill-package-evidence.yml"
      - "schema/k4-r4-agent-skill-package-evidence.schema.json"
      - "packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts"
      - "packages/kodac-runtime/src/index.ts"
      - "packages/kodac-runtime/test/k4-r4-agent-skill-package-evidence.test.ts"

permissions:
  contents: read

jobs:
  agent-skill-package-evidence:
    name: k4-r4-agent-skill-package-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      K4_R4_IMPLEMENTATION_BASE_SHA: "8aac41ec871446f138f8502b1224e947aa67ed95"
      K4_R4_IMPLEMENTATION_BASE_TREE: "e054cc4249549739b9be6b2e35078edb56c2c0a8"
      K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA: "51e5fc15ab276c08672709ede24d052009ffa8df"
      K4_R4_IMPLEMENTATION_ADMISSION_PARENT_TREE: "66347593eb9db103a4aa28a00fd0a5134dcc90a0"
      K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_SHA: "4156090cc469aaf055fba9bd6ff63ff6c85128f5"
      K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_TREE: "8e4d12eb2d92c2f221330737863aea5903d42e41"
      K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_SHA: "8f5109ace2f8f2348dd64acaff97c1b583181d8b"
      K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_TREE: "065e86f8622e67f1f9bb1c4050aa0f146a06012c"
      K4_R4_IMPLEMENTATION_BRANCH: "codex/k4-r4-agent-skill-package-evidence"
      K4_R4_IMPLEMENTATION_PULL_REQUEST: "183"
      K4_R4_CANONICAL_ARTIFACT_SHA: "51e5fc15ab276c08672709ede24d052009ffa8df"
      K4_R4_CANONICAL_ARTIFACT_TREE: "66347593eb9db103a4aa28a00fd0a5134dcc90a0"
      K4_R4_CANONICAL_SCHEMA_BLOB: "fc591ca005c049205965315c9cef01d4e37c0cbd"
      K4_R4_CANONICAL_SOURCE_BLOB: "c5f5952514db9a9ce51904652456134f2ca00672"
      K4_R4_CANONICAL_TEST_BLOB: "f2aaf5dbe8a9fe7681cdf32519279fd6685db593"
      K4_R4_AUTHORIZATION_DOCUMENT_BLOB: "401fbf9a75675e4e2c96fc0b65199728fc08a0a6"
      K4_R4_AGENT_SKILLS_STANDARD_PIN_IDENTITY: "c82752ee60cfa019caaddda9d0230fbeb6f3b9051346135879bbc40563590819"
      K4_R4_CANONICAL_K4_R1_CONTRACTS_BLOB: "5a1ba557c89c2c312789f94a9a495e262f411057"
      K4_R4_CANONICAL_K4_R1_REGISTRY_BLOB: "4b3e6d7247fe02e6ec875e3f599e263afd15be96"
      K4_R4_CANONICAL_PROVENANCE_VALIDATOR_BLOB: "e312be037d5a7e4d6645b7056cb948486d035848"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Attest exact PR head, authorization, scope, and closed gate mode
        shell: bash
        env:
          K4_R4_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          K4_R4_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          K4_R4_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          K4_R4_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          K4_R4_PR_NUMBER: ${{ github.event.pull_request.number }}
          K4_R4_PR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$K4_R4_PR_HEAD_SHA"

          git status --porcelain=v1 -z --untracked-files=all --ignored=matching > "$RUNNER_TEMP/k4-r4-status-before"
          git diff --binary HEAD -- > "$RUNNER_TEMP/k4-r4-diff-before"
          test ! -s "$RUNNER_TEMP/k4-r4-status-before"
          test ! -s "$RUNNER_TEMP/k4-r4-diff-before"

          workflow=".github/workflows/k4-r4-agent-skill-package-evidence.yml"
          if test "$K4_R4_PR_HEAD_REF" = "$K4_R4_IMPLEMENTATION_BRANCH"; then
            test "$K4_R4_PR_HEAD_REPOSITORY" = "$K4_R4_PR_REPOSITORY"
            test "$K4_R4_PR_NUMBER" = "$K4_R4_IMPLEMENTATION_PULL_REQUEST"
            test "$K4_R4_PR_BASE_SHA" = "$K4_R4_IMPLEMENTATION_BASE_SHA"

            mapfile -t head_parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#head_parents[@]}" -eq 1
            test "${head_parents[0]}" = "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA"

            git fetch --no-tags --depth=1 origin "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA"
            test "$(git rev-parse "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA^{tree}")" = "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_TREE"
            mapfile -t parent_parents < <(git cat-file -p "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA" | sed -n 's/^parent //p')
            test "${#parent_parents[@]}" -eq 1
            test "${parent_parents[0]}" = "$K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_SHA"

            git fetch --no-tags --depth=1 origin "$K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_SHA"
            test "$(git rev-parse "$K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_SHA^{tree}")" = "$K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_TREE"
            mapfile -t grandparent_parents < <(git cat-file -p "$K4_R4_IMPLEMENTATION_ADMISSION_GRANDPARENT_SHA" | sed -n 's/^parent //p')
            test "${#grandparent_parents[@]}" -eq 1
            test "${grandparent_parents[0]}" = "$K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_SHA"

            git fetch --no-tags --depth=1 origin "$K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_SHA"
            test "$(git rev-parse "$K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_SHA^{tree}")" = "$K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_TREE"
            mapfile -t candidate_parents < <(git cat-file -p "$K4_R4_IMPLEMENTATION_ADMISSION_CANDIDATE_SHA" | sed -n 's/^parent //p')
            test "${#candidate_parents[@]}" -eq 1
            test "${candidate_parents[0]}" = "$K4_R4_IMPLEMENTATION_BASE_SHA"

            git fetch --no-tags --depth=1 origin "$K4_R4_IMPLEMENTATION_BASE_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$K4_R4_IMPLEMENTATION_BASE_SHA"
            test "$(git rev-parse "$K4_R4_IMPLEMENTATION_BASE_SHA^{tree}")" = "$K4_R4_IMPLEMENTATION_BASE_TREE"
            test "$(git rev-parse "$K4_R4_IMPLEMENTATION_BASE_SHA:docs/planning/KODAC_K4_R4_CALLER_MATERIALIZED_AGENT_SKILL_PACKAGE_EVIDENCE_AUTHORIZATION_2026-08-24.md")" = "$K4_R4_AUTHORIZATION_DOCUMENT_BLOB"

            mapfile -t changed < <(git diff --name-only "$K4_R4_IMPLEMENTATION_BASE_SHA" HEAD | LC_ALL=C sort)
            expected=(
              ".github/workflows/k4-r4-agent-skill-package-evidence.yml"
              "packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts"
              "packages/kodac-runtime/src/index.ts"
              "packages/kodac-runtime/test/k4-r4-agent-skill-package-evidence.test.ts"
              "schema/k4-r4-agent-skill-package-evidence.schema.json"
            )
            test "${#changed[@]}" -eq "${#expected[@]}"
            for index in "${!expected[@]}"; do
              test "${changed[$index]}" = "${expected[$index]}"
            done

            mapfile -t admission_delta < <(git diff --name-only "$K4_R4_IMPLEMENTATION_ADMISSION_PARENT_SHA" HEAD)
            test "${#admission_delta[@]}" -eq 1
            test "${admission_delta[0]}" = "$workflow"
          else
            git fetch --no-tags --depth=1 origin "$K4_R4_PR_BASE_SHA"
            test "$(git rev-parse FETCH_HEAD)" = "$K4_R4_PR_BASE_SHA"
            mapfile -t changed < <(git diff --name-only "$K4_R4_PR_BASE_SHA" HEAD | LC_ALL=C sort)
            for path in "${changed[@]}"; do
              test "$path" != "$workflow"
            done
          fi

          action_key="u""ses"
          mapfile -t actual_action_lines < <(
            grep -nE "(^|[^[:alnum:]_])${action_key}([^[:alnum:]_]|$)" "$workflow" | cut -d: -f2-
          )
          expected_action_lines=(
            "      - ${action_key}: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
            "      - ${action_key}: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4"
            "      - ${action_key}: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6"
          )
          test "${#actual_action_lines[@]}" -eq "${#expected_action_lines[@]}"
          for index in "${!expected_action_lines[@]}"; do
            test "${actual_action_lines[$index]}" = "${expected_action_lines[$index]}"
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Sync the locked Python validation environment outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/k4-r4-schema-venv"
          uv sync --frozen --dev

      - name: Structurally attest every immutable Action reference
        shell: bash
        run: |
          set -euo pipefail
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/k4-r4-schema-venv"
          uv run --frozen --no-sync python <<'PY'
          import copy
          from pathlib import Path

          import yaml

          workflow = Path(".github/workflows/k4-r4-agent-skill-package-evidence.yml")
          document = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          action_key = "u" + "ses"
          expected = [
              (
                  ("jobs", "agent-skill-package-evidence", "steps", 0, action_key),
                  "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
              ),
              (
                  ("jobs", "agent-skill-package-evidence", "steps", 2, action_key),
                  "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
              ),
              (
                  ("jobs", "agent-skill-package-evidence", "steps", 3, action_key),
                  "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
              ),
          ]

          def action_references(value, path=(), active=None):
              if active is None:
                  active = set()
              if isinstance(value, (dict, list)):
                  identity = id(value)
                  if identity in active:
                      raise ValueError("YAML alias cycle is prohibited")
                  active.add(identity)
                  try:
                      if isinstance(value, dict):
                          for key, nested in value.items():
                              nested_path = (*path, key)
                              if key == action_key:
                                  yield nested_path, nested
                              yield from action_references(nested, nested_path, active)
                      else:
                          for index, nested in enumerate(value):
                              yield from action_references(nested, (*path, index), active)
                  finally:
                      active.remove(identity)

          def validate(candidate):
              if not isinstance(candidate, dict):
                  raise ValueError("workflow must be a mapping")
              jobs = candidate.get("jobs")
              if not isinstance(jobs, dict) or set(jobs) != {"agent-skill-package-evidence"}:
                  raise ValueError("workflow must contain exactly the canonical K4-R4 validation job")
              actual = list(action_references(candidate))
              if actual != expected:
                  raise ValueError(f"unexpected Action or reusable-workflow references: {actual!r}")

          validate(document)
          hidden_job = copy.deepcopy(document)
          hidden_job["jobs"]["unapproved"] = {
              action_key: "example/unapproved/.github/workflows/check.yml@deadbeef"
          }
          extra_step = copy.deepcopy(document)
          extra_step["jobs"]["agent-skill-package-evidence"]["steps"].append(
              {action_key: "example/unapproved@deadbeef"}
          )
          for candidate in (hidden_job, extra_step):
              try:
                  validate(candidate)
              except ValueError:
                  pass
              else:
                  raise SystemExit("structural validator accepted an unapproved Action reference")
          PY

      - name: Prove canonical K4-R1 dependencies and K4-R4 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$K4_R4_CANONICAL_ARTIFACT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$K4_R4_CANONICAL_ARTIFACT_SHA"
          test "$(git rev-parse "$K4_R4_CANONICAL_ARTIFACT_SHA^{tree}")" = "$K4_R4_CANONICAL_ARTIFACT_TREE"

          canonical_paths=(
            "schema/k4-r4-agent-skill-package-evidence.schema.json:$K4_R4_CANONICAL_SCHEMA_BLOB"
            "packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts:$K4_R4_CANONICAL_SOURCE_BLOB"
            "packages/kodac-runtime/test/k4-r4-agent-skill-package-evidence.test.ts:$K4_R4_CANONICAL_TEST_BLOB"
          )
          for entry in "${canonical_paths[@]}"; do
            path="${entry%%:*}"
            expected_blob="${entry##*:}"
            test "$(git rev-parse "$K4_R4_CANONICAL_ARTIFACT_SHA:$path")" = "$expected_blob"
            test "$(git rev-parse "HEAD:$path")" = "$expected_blob"
          done

          test "$(git rev-parse "HEAD:packages/kodac-runtime/src/compatibility/contracts.ts")" = "$K4_R4_CANONICAL_K4_R1_CONTRACTS_BLOB"
          test "$(git rev-parse "HEAD:packages/kodac-runtime/src/compatibility/registry.ts")" = "$K4_R4_CANONICAL_K4_R1_REGISTRY_BLOB"
          index="packages/kodac-runtime/src/index.ts"
          test "$(grep -Fxc 'export * from "./compatibility/contracts.ts"' "$index")" -eq 1
          test "$(grep -Fxc 'export * from "./compatibility/registry.ts"' "$index")" -eq 1
          test "$(grep -Fxc 'export * from "./compatibility/agent-skill-package-evidence.ts"' "$index")" -eq 1

      - name: Prove the bounded deterministic K4-R4 production surface
        shell: bash
        run: |
          set -euo pipefail
          source_path="packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts"
          schema_path="schema/k4-r4-agent-skill-package-evidence.schema.json"
          test -f "$source_path"
          test -f "$schema_path"

          pattern='node:(fs|child_process|http|https|http2|net|tls|dgram|worker_threads|os|path)|ExecutionGateway|Trust Kernel|WorkspaceFileSystem|require[[:space:]]*\(|import[[:space:]]*\(|process[[:space:]]*\.|Date[[:space:]]*\(|Date\.now|Math\.random|randomUUID|getRandomValues|performance\.now|setTimeout|setInterval|writeFile|readFile|fetch[[:space:]]*\(|eval[[:space:]]*\(|new[[:space:]]+Function|\.register[[:space:]]*\(|\.dispose[[:space:]]*\('
          if grep -nE "$pattern" "$source_path"; then
            echo "K4-R4 Agent Skill package evidence purity/determinism boundary violation" >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"
          const sourcePath = "packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts"
          const source = readFileSync(sourcePath, "utf8")
          const specifiers = [
            ...source.matchAll(/\bfrom\s+["']([^"']+)["']/g),
            ...source.matchAll(/\bimport\s+["']([^"']+)["']/g),
          ].map((match) => match[1])
          const expected = ["node:crypto", "node:util", "./contracts.ts", "./registry.ts"]
          if (JSON.stringify(specifiers) !== JSON.stringify(expected)) {
            throw new Error(`K4-R4 import surface mismatch: ${specifiers.join(", ")}`)
          }
          if (/\bimport\s*\(/.test(source)) throw new Error("Dynamic import is prohibited in K4-R4")
          const utilMembers = [...source.matchAll(/\butilTypes\.([A-Za-z_$][A-Za-z0-9_$]*)/g)]
          if (utilMembers.length === 0 || utilMembers.some((match) => match[1] !== "isProxy")) {
            throw new Error("K4-R4 node:util use is limited to utilTypes.isProxy")
          }
          const cryptoImports = source.split(/\r?\n/).filter((line) => /from\s+["']node:crypto["']/.test(line))
          if (JSON.stringify(cryptoImports) !== JSON.stringify(['import { createHash } from "node:crypto"'])) {
            throw new Error("K4-R4 node:crypto use is limited to createHash")
          }
          JSON.parse(readFileSync("schema/k4-r4-agent-skill-package-evidence.schema.json", "utf8"))
          NODE

      - name: Validate Draft 2020-12 schema against actual K4-R4 evidence
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE' > "$RUNNER_TEMP/k4-r4-values.json"
          import { createHash } from "node:crypto"
          import {
            K4_R4_AGENT_SKILLS_STANDARD_PIN_IDENTITY,
            materializeAgentSkillPackageEvidence,
          } from "./packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts"
          import { CompatibilityBindingRegistry } from "./packages/kodac-runtime/src/compatibility/registry.ts"
          import { createExtensionDescriptor } from "./packages/kodac-runtime/src/extensions/contracts.ts"
          import { ExtensionDescriptorRegistry } from "./packages/kodac-runtime/src/extensions/registry.ts"

          const digest = (text) => createHash("sha256").update(text, "utf8").digest("hex")
          const descriptor = createExtensionDescriptor({
            extensionId: "kodac/agent-skill-adapter",
            extensionVersion: "1.0.0",
            provenance: {
              sourceType: "EXTERNAL_DECLARATION",
              sourceId: "kodac/k4-r4-schema-check",
              sourceRevision: "1.0.0",
              license: "Apache-2.0",
              intakeMode: "DECLARATION",
            },
            capabilities: [{ capabilityId: "skills/read", roles: ["PROVIDER"] }],
          })
          const extensions = new ExtensionDescriptorRegistry()
          extensions.register(descriptor)
          const registry = new CompatibilityBindingRegistry(extensions)
          const input = {
            standardPinIdentity: K4_R4_AGENT_SKILLS_STANDARD_PIN_IDENTITY,
            extensionId: descriptor.extensionId,
            descriptorIdentity: descriptor.descriptorIdentity,
            directoryName: "release-notes",
            name: "release-notes",
            description: "Prepare release notes.",
            license: null,
            compatibility: null,
            metadataEntries: [],
            allowedToolsEvidence: null,
            instructionBodyEvidence: { sha256: digest(""), byteLength: 0 },
            skillFileEvidence: { sha256: digest("skill"), byteLength: 5 },
            packageManifestEvidence: { sha256: digest("manifest"), fileCount: 1, totalByteLength: 5 },
            sourceProvenanceIdentity: digest("caller-provenance"),
          }
          process.stdout.write(JSON.stringify({ input, evidence: materializeAgentSkillPackageEvidence(input, registry) }))
          NODE

          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/k4-r4-schema-venv"
          uv run --frozen --no-sync python <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schema/k4-r4-agent-skill-package-evidence.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          values = json.loads(Path(os.environ["RUNNER_TEMP"], "k4-r4-values.json").read_text(encoding="utf-8"))
          validator.validate(values["input"])
          validator.validate(values["evidence"])

          mutations = []
          raw_leak = copy.deepcopy(values["evidence"])
          raw_leak["description"] = "untrusted text"
          mutations.append(("raw text leak", raw_leak))
          wrong_kind = copy.deepcopy(values["evidence"])
          wrong_kind["objectKind"] = "MCP_TOOL"
          mutations.append(("wrong object kind", wrong_kind))
          unbound_leak = copy.deepcopy(values["evidence"])
          unbound_leak["normalizedCapabilityIds"] = ["skills/read"]
          mutations.append(("UNBOUND capability leak", unbound_leak))
          unbound_binding_leak = copy.deepcopy(values["evidence"])
          unbound_binding_leak["bindingIdentity"] = "a" * 64
          mutations.append(("UNBOUND binding leak", unbound_binding_leak))
          unbound_disposition_leak = copy.deepcopy(values["evidence"])
          unbound_disposition_leak["disposition"] = "UNRESOLVED"
          mutations.append(("UNBOUND disposition leak", unbound_disposition_leak))
          wrong_source = copy.deepcopy(values["evidence"])
          wrong_source["sourceEvidence"]["sourceCommit"] = "0" * 40
          mutations.append(("wrong source", wrong_source))
          raw_tools = copy.deepcopy(values["input"])
          raw_tools["allowedTools"] = "Read"
          mutations.append(("raw allowed-tools", raw_tools))
          for name, candidate in mutations:
              if not list(validator.iter_errors(candidate)):
                  raise SystemExit(f"schema accepted hostile K4-R4 mutation: {name}")
          PY

      - name: Install locked TypeScript validation tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix packages/kodac-runtime --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@24.3.0

      - name: Run strict TypeScript, Python, Ruff, provenance, focused, and full runtime gates
        shell: bash
        run: |
          set -euo pipefail
          node packages/kodac-runtime/node_modules/typescript/bin/tsc -p packages/kodac-runtime/tsconfig.json --noEmit
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/k4-r4-schema-venv"
          uv run --frozen --no-sync pytest -p no:cacheprovider
          uv run --frozen --no-sync ruff check --no-cache .
          test "$(git rev-parse "HEAD:tools/validate_provenance.py")" = "$K4_R4_CANONICAL_PROVENANCE_VALIDATOR_BLOB"
          uv run --frozen --no-sync python tools/validate_provenance.py
          node --experimental-strip-types --check packages/kodac-runtime/src/compatibility/agent-skill-package-evidence.ts
          node --experimental-strip-types --test packages/kodac-runtime/test/k4-r4-agent-skill-package-evidence.test.ts
          node --experimental-strip-types --test packages/kodac-runtime/test/*.test.ts

      - name: Remove ephemeral TypeScript validation tooling
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- packages/kodac-runtime/node_modules
          rm -f -- packages/kodac-runtime/package-lock.json

      - name: Attest checkout unchanged after K4-R4 validation
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 -z --untracked-files=all --ignored=matching > "$RUNNER_TEMP/k4-r4-status-after"
          git diff --binary HEAD -- > "$RUNNER_TEMP/k4-r4-diff-after"
          cmp "$RUNNER_TEMP/k4-r4-status-before" "$RUNNER_TEMP/k4-r4-status-after"
          cmp "$RUNNER_TEMP/k4-r4-diff-before" "$RUNNER_TEMP/k4-r4-diff-after"
          test ! -s "$RUNNER_TEMP/k4-r4-status-after"
          test ! -s "$RUNNER_TEMP/k4-r4-diff-after"
