name: k6-r4-trusted-qualification

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/k6-r4-privacy-governed-outcome-memory.yml"
      - "schema/k6-r4-privacy-governed-outcome-memory.schema.json"
      - "packages/kodac-runtime/src/evidence-router/outcome-memory-contracts.ts"
      - "packages/kodac-runtime/src/evidence-router/outcome-memory.ts"
      - "packages/kodac-runtime/src/index.ts"
      - "packages/kodac-runtime/test/k6-r4-privacy-governed-outcome-memory.test.ts"

permissions:
  contents: read

jobs:
  trusted-r4-qualification:
    name: k6-r4-trusted-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENT_REPOSITORY: ${{ github.repository }}
      EVENT_PR_NUMBER: ${{ github.event.number }}
      EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect exact R4 candidate as untrusted data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          REPOSITORY = "TheHalfMoon/Kodac"
          AUTHORIZED_PR = 212
          AUTHORIZED_HEAD_REF = "feat/k6-r4-privacy-governed-outcome-memory"
          HARDENING_MERGE_SHA = "34aa910bb72856ee138e64e47354d8d93072052d"
          HARDENING_PATH = "docs/planning/KODAC_K6_R4_TRUSTED_QUALIFICATION_HARDENING_AUTHORIZATION_2026-08-27.md"
          HARDENING_BLOB = "9e21684993b8ef3940434560787b63c00d55866b"
          ORIGINAL_R4_AUTH_PATH = "docs/planning/KODAC_K6_R4_PRIVACY_GOVERNED_OUTCOME_MEMORY_AUTHORIZATION_2026-08-26.md"
          ORIGINAL_R4_AUTH_BLOB = "db0cd6f5484494c1fcacb37570465059a0484c63"
          REPLACEMENT_AUTH_PATH = "docs/planning/KODAC_K6_R4_TRUSTED_QUALIFICATION_REPLACEMENT_AUTHORIZATION_2026-08-27.md"
          TRUSTED_WORKFLOW_PATH = ".github/workflows/k6-r4-trusted-qualification.yml"
          R4_WORKFLOW_PATH = ".github/workflows/k6-r4-privacy-governed-outcome-memory.yml"
          R4_SCHEMA_PATH = "schema/k6-r4-privacy-governed-outcome-memory.schema.json"
          R4_CONTRACTS_PATH = "packages/kodac-runtime/src/evidence-router/outcome-memory-contracts.ts"
          R4_RUNTIME_PATH = "packages/kodac-runtime/src/evidence-router/outcome-memory.ts"
          R4_INDEX_PATH = "packages/kodac-runtime/src/index.ts"
          R4_TEST_PATH = "packages/kodac-runtime/test/k6-r4-privacy-governed-outcome-memory.test.ts"
          EXPECTED_PATH_STATUS = {
              R4_WORKFLOW_PATH: "added",
              R4_SCHEMA_PATH: "added",
              R4_CONTRACTS_PATH: "added",
              R4_RUNTIME_PATH: "added",
              R4_INDEX_PATH: "modified",
              R4_TEST_PATH: "added",
          }
          EXPECTED_PATHS = sorted(EXPECTED_PATH_STATUS)
          NON_WORKFLOW_R4_PATHS = sorted(path for path in EXPECTED_PATHS if path != R4_WORKFLOW_PATH)
          NAMED_STEPS = [
              "Attest exact head, authorization, six-path scope, predecessor pins, and immutable Actions",
              "Sync locked validation environment outside the checkout",
              "Validate R4 schema registration, predecessor references, and runtime parity",
              "Prove pure authority-bounded production surface and live ruleset",
              "Install integrity-locked TypeScript validation tooling outside the checkout",
              "Run strict TypeScript, focused R4 and predecessor regressions, full runtime, Python, Ruff, and provenance gates",
              "Remove ephemeral TypeScript validation tooling",
              "Attest checkout unchanged after K6-R4 validation",
          ]
          ACTION_BLOCKS = [
              ["- uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4", "with:", "ref: ${{ github.event.pull_request.head.sha }}", "persist-credentials: false", "fetch-depth: 0"],
              ["- uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4", "with:", 'node-version: "24.18.0"'],
              ["- uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6", "with:", 'version: "0.12.1"', "enable-cache: false"],
          ]
          EXPECTED_STEP_HEADERS = [
              ACTION_BLOCKS[0][0], f"- name: {NAMED_STEPS[0]}", ACTION_BLOCKS[1][0], ACTION_BLOCKS[2][0],
              f"- name: {NAMED_STEPS[1]}", f"- name: {NAMED_STEPS[2]}", f"- name: {NAMED_STEPS[3]}",
              f"- name: {NAMED_STEPS[4]}", f"- name: {NAMED_STEPS[5]}", f"- name: {NAMED_STEPS[6]}", f"- name: {NAMED_STEPS[7]}",
          ]
          REQUIRED_EXECUTABLE_LINES = [
              "uv sync --frozen --dev",
              'node "$RUNNER_TEMP/k6-r4-typescript/node_modules/typescript/bin/tsc" -p packages/kodac-runtime/tsconfig.json --noEmit --typeRoots "$RUNNER_TEMP/k6-r4-typescript/node_modules/@types"',
              "node --experimental-strip-types --check packages/kodac-runtime/src/evidence-router/outcome-memory-contracts.ts",
              "node --experimental-strip-types --check packages/kodac-runtime/src/evidence-router/outcome-memory.ts",
              "node --experimental-strip-types --test packages/kodac-runtime/test/k6-r4-privacy-governed-outcome-memory.test.ts",
              "node --experimental-strip-types --test packages/kodac-runtime/test/k6-r3-route-outcome-linkage.test.ts",
              "node --experimental-strip-types --test packages/kodac-runtime/test/k6-r2-deterministic-route-plan.test.ts",
              "node --experimental-strip-types --test packages/kodac-runtime/test/k6-r1-model-provider-route-eligibility.test.ts",
              "(cd packages/kodac-runtime && npm test)",
              "uv run --frozen --no-sync pytest -p no:cacheprovider",
              "uv run --frozen --no-sync ruff check --no-cache .",
              "uv run --frozen --no-sync python tools/validate_provenance.py",
          ]
          MANIFEST_BEGIN = "K6_R4_TRUSTED_INSPECTOR_MANIFEST_JSON_BEGIN"
          MANIFEST_END = "K6_R4_TRUSTED_INSPECTOR_MANIFEST_JSON_END"
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          SHA256_RE = re.compile(r"^[0-9a-f]{64}$")
          TOKEN = os.environ.get("READ_ONLY_GITHUB_TOKEN", "")

          def fail(label: str) -> None:
              raise SystemExit(f"K6-R4 trusted qualification failed: {label}")

          def require(condition: bool, label: str) -> None:
              if not condition:
                  fail(label)

          def env(name: str) -> str:
              value = os.environ.get(name, "")
              require(bool(value), f"missing event field {name}")
              return value

          def unique_object(pairs: list[tuple[str, object]]) -> dict:
              out: dict[str, object] = {}
              for key, value in pairs:
                  require(key not in out, "JSON object contains duplicate keys")
                  out[key] = value
              return out

          def parse_json(raw: bytes, label: str) -> object:
              try:
                  return json.loads(raw, object_pairs_hook=unique_object)
              except SystemExit:
                  raise
              except Exception:
                  fail(f"{label} is not valid JSON")

          def api_json(path: str) -> dict:
              require(path.startswith("/repos/TheHalfMoon/Kodac/"), "GitHub API path escaped repository boundary")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {TOKEN}", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "kodac-k6-r4-trusted-qualification"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = response.read(8_000_001)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  fail("read-only GitHub API request failed")
              require(len(payload) <= 8_000_000, "GitHub API response exceeds inspector bound")
              value = parse_json(payload, "GitHub API response")
              require(isinstance(value, dict), "GitHub API response has unexpected shape")
              return value

          def compare(base: str, head: str) -> dict:
              require(SHA_RE.fullmatch(base) is not None and SHA_RE.fullmatch(head) is not None, "compare refs are not immutable SHAs")
              return api_json(f"/repos/{REPOSITORY}/compare/{base}...{head}")

          def file_at(ref: str, path: str) -> tuple[str, str]:
              require(SHA_RE.fullmatch(ref) is not None, "file ref is not an immutable SHA")
              value = api_json(f"/repos/{REPOSITORY}/contents/{urllib.parse.quote(path, safe='/')}?ref={ref}")
              blob = value.get("sha")
              require(isinstance(blob, str) and SHA_RE.fullmatch(blob) is not None, "file blob identity unavailable")
              require(value.get("encoding") == "base64" and isinstance(value.get("content"), str), "file content is not inline base64")
              try:
                  raw = base64.b64decode(value["content"], validate=False)
              except Exception:
                  fail("file content base64 decode failed")
              require(len(raw) <= 2_000_000, "candidate file exceeds inspector bound")
              try:
                  return raw.decode("utf-8", errors="strict"), blob
              except UnicodeDecodeError:
                  fail("candidate file is not UTF-8")

          def extract_manifest(text: str) -> dict:
              require(text.count(MANIFEST_BEGIN) == 1 and text.count(MANIFEST_END) == 1, "replacement authorization manifest markers invalid")
              start = text.index(MANIFEST_BEGIN) + len(MANIFEST_BEGIN)
              end = text.index(MANIFEST_END, start)
              payload = text[start:end].strip().encode("utf-8")
              require(0 < len(payload) <= 100_000, "replacement authorization manifest size invalid")
              manifest = parse_json(payload, "replacement authorization manifest")
              require(isinstance(manifest, dict), "replacement authorization manifest shape invalid")
              require(set(manifest) == {"version", "authorized_pr", "trusted_workflow_path", "trusted_workflow_merge_sha", "trusted_workflow_blob", "required_candidate_blobs", "required_named_step_sha256", "required_workflow_fragments", "forbidden_workflow_fragments"}, "replacement authorization manifest key set invalid")
              require(manifest["version"] == "kodac-k6-r4-trusted-inspector-manifest-v2", "replacement authorization manifest version invalid")
              require(manifest["authorized_pr"] == AUTHORIZED_PR and manifest["trusted_workflow_path"] == TRUSTED_WORKFLOW_PATH, "replacement authorization identity binding invalid")
              return manifest

          def string_list(value: object, label: str, minimum: int = 0, maximum: int = 256) -> list[str]:
              require(isinstance(value, list) and minimum <= len(value) <= maximum, f"{label} length invalid")
              out: list[str] = []
              for item in value:
                  require(isinstance(item, str) and 0 < len(item) <= 4096, f"{label} contains invalid string")
                  out.append(item)
              require(len(set(out)) == len(out), f"{label} contains duplicates")
              return out

          def inspect_steps(workflow: str) -> dict[str, str]:
              lines = workflow.splitlines()
              step_markers = [i for i, line in enumerate(lines) if line == "    steps:"]
              require(len(step_markers) == 1, "candidate workflow steps section count drift")
              positions = [i for i in range(step_markers[0] + 1, len(lines)) if re.match(r"^      - ", lines[i])]
              require(len(positions) == len(EXPECTED_STEP_HEADERS), "candidate workflow top-level step count drift")
              require([lines[i].strip() for i in positions] == EXPECTED_STEP_HEADERS, "candidate workflow top-level step sequence drift")
              positions.append(len(lines))
              named: dict[str, str] = {}
              actions: list[list[str]] = []
              for n in range(len(positions) - 1):
                  raw = lines[positions[n]:positions[n + 1]]
                  header = raw[0].strip()
                  normalized = [line.strip() for line in raw if line.strip()]
                  if header.startswith("- uses:"):
                      actions.append(normalized)
                      continue
                  require(header.startswith("- name: "), "candidate workflow contains unrecognized step form")
                  name = header[len("- name: "):]
                  require(name in NAMED_STEPS and name not in named, "candidate workflow named-step identity drift")
                  require(sum(line == "        shell: bash" for line in raw) == 1, "candidate named step shell drift")
                  require(sum(line == "        run: |" for line in raw) == 1, "candidate named step run-block drift")
                  named[name] = "\n".join(raw) + "\n"
              require(list(named) == NAMED_STEPS, "candidate workflow named-step sequence drift")
              require(actions == ACTION_BLOCKS, "candidate workflow action metadata drift")
              return named

          event_repo = env("EVENT_REPOSITORY")
          event_pr = env("EVENT_PR_NUMBER")
          event_base_ref = env("EVENT_BASE_REF")
          event_base_sha = env("EVENT_BASE_SHA")
          event_head_ref = env("EVENT_HEAD_REF")
          event_head_sha = env("EVENT_HEAD_SHA")
          event_head_repo = env("EVENT_HEAD_REPOSITORY")
          require(bool(TOKEN), "read-only GitHub token unavailable")
          require(event_repo == REPOSITORY and event_pr == str(AUTHORIZED_PR), "repository or PR identity mismatch")
          require(event_base_ref == "main" and event_head_ref == AUTHORIZED_HEAD_REF and event_head_repo == REPOSITORY, "PR ref/repository boundary drift")
          require(SHA_RE.fullmatch(event_base_sha) is not None and SHA_RE.fullmatch(event_head_sha) is not None and event_base_sha != event_head_sha, "event revision identity invalid")

          current_pr = api_json(f"/repos/{REPOSITORY}/pulls/{AUTHORIZED_PR}")
          require(current_pr.get("number") == AUTHORIZED_PR and current_pr.get("state") == "open" and current_pr.get("draft") is False, "authorized PR state drift")
          require(current_pr.get("head", {}).get("sha") == event_head_sha and current_pr.get("head", {}).get("ref") == AUTHORIZED_HEAD_REF and current_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY, "authorized PR head moved after event")
          require(current_pr.get("base", {}).get("ref") == "main" and current_pr.get("base", {}).get("sha") == event_base_sha, "authorized PR base moved after event")
          require(api_json(f"/repos/{REPOSITORY}/git/ref/heads/main").get("object", {}).get("sha") == event_base_sha, "protected main moved after event")

          hardening_lineage = compare(HARDENING_MERGE_SHA, event_base_sha)
          require(hardening_lineage.get("merge_base_commit", {}).get("sha") == HARDENING_MERGE_SHA, "event base does not descend from hardening merge")
          hardening_text, hardening_blob = file_at(event_base_sha, HARDENING_PATH)
          require(hardening_blob == HARDENING_BLOB and "K6-R4 Trusted Qualification Hardening Authorization" in hardening_text, "hardening authorization drift")
          require(file_at(event_base_sha, ORIGINAL_R4_AUTH_PATH)[1] == ORIGINAL_R4_AUTH_BLOB, "original R4 authorization drift")

          replacement_text, replacement_blob = file_at(event_base_sha, REPLACEMENT_AUTH_PATH)
          manifest = extract_manifest(replacement_text)
          trusted_merge, trusted_blob = manifest["trusted_workflow_merge_sha"], manifest["trusted_workflow_blob"]
          require(isinstance(trusted_merge, str) and SHA_RE.fullmatch(trusted_merge) is not None and isinstance(trusted_blob, str) and SHA_RE.fullmatch(trusted_blob) is not None, "trusted workflow identity invalid")
          require(compare(HARDENING_MERGE_SHA, trusted_merge).get("merge_base_commit", {}).get("sha") == HARDENING_MERGE_SHA, "trusted workflow merge ancestry drift")
          require(compare(trusted_merge, event_base_sha).get("merge_base_commit", {}).get("sha") == trusted_merge, "event base does not descend from exact trusted workflow merge")
          trusted_at_merge, trusted_blob_at_merge = file_at(trusted_merge, TRUSTED_WORKFLOW_PATH)
          trusted_at_base, trusted_blob_at_base = file_at(event_base_sha, TRUSTED_WORKFLOW_PATH)
          require(trusted_blob_at_merge == trusted_blob == trusted_blob_at_base and trusted_at_merge == trusted_at_base, "trusted workflow canonical bytes drift")
          require("pull_request_target:" in trusted_at_base and "permissions:\n  contents: read" in trusted_at_base, "trusted inspector canonical boundary drift")

          comparison = compare(event_base_sha, event_head_sha)
          require(comparison.get("base_commit", {}).get("sha") == event_base_sha and comparison.get("merge_base_commit", {}).get("sha") == event_base_sha, "candidate compare/base ancestry drift")
          require(comparison.get("behind_by") == 0 and comparison.get("ahead_by", 0) > 0, "candidate ancestry drift")
          files = comparison.get("files")
          require(isinstance(files, list) and len(files) == len(EXPECTED_PATHS), "candidate compare file count invalid")
          compare_blob: dict[str, str] = {}
          seen: set[str] = set()
          for item in files:
              require(isinstance(item, dict), "candidate compare file entry invalid")
              path = item.get("filename")
              require(isinstance(path, str) and path in EXPECTED_PATH_STATUS and path not in seen, "candidate compare path invalid or duplicated")
              seen.add(path)
              require(item.get("status") == EXPECTED_PATH_STATUS[path] and item.get("previous_filename") in (None, ""), "candidate compare status or rename drift")
              blob = item.get("sha")
              require(isinstance(blob, str) and SHA_RE.fullmatch(blob) is not None, "candidate compare blob invalid")
              compare_blob[path] = blob
          require(sorted(seen) == EXPECTED_PATHS, "candidate changed-file set is not exact six-path allowlist")

          candidate_text: dict[str, str] = {}
          candidate_blob: dict[str, str] = {}
          for path in EXPECTED_PATHS:
              text, blob = file_at(event_head_sha, path)
              require(blob == compare_blob[path], "candidate exact-head blob disagrees with compare entry")
              candidate_text[path], candidate_blob[path] = text, blob

          required_blobs = manifest["required_candidate_blobs"]
          require(isinstance(required_blobs, dict) and sorted(required_blobs) == NON_WORKFLOW_R4_PATHS, "replacement manifest candidate blob scope invalid")
          for path in NON_WORKFLOW_R4_PATHS:
              expected_blob = required_blobs[path]
              require(isinstance(expected_blob, str) and SHA_RE.fullmatch(expected_blob) is not None and candidate_blob[path] == expected_blob, "candidate non-workflow R4 blob drift")

          workflow = candidate_text[R4_WORKFLOW_PATH]
          require(workflow.count("pull_request_target") == 0 and workflow.count("pull_request:") == 1, "candidate workflow trigger drift")
          require("permissions:\n  contents: read\n\njobs:" in workflow and workflow.count("permissions:") == 1, "candidate workflow permission boundary drift")
          for forbidden in ["continue-on-error:", "workflow_dispatch:", "schedule:", "container:", "services:", "defaults:", "id-token:", "contents: write", "pull-requests: write", "actions: write", "checks: write", "NODE_OPTIONS:", "BASH_ENV:", "LD_PRELOAD:", "PYTHONPATH:", "working-directory:", "|| true", "GITHUB_ENV", "GITHUB_PATH", "::add-path", "::set-env"]:
              require(forbidden not in workflow, "candidate workflow contains prohibited control surface")
          jobs_suffix = workflow.split("jobs:\n", 1)[1]
          require(re.findall(r"(?m)^  ([A-Za-z0-9_-]+):\s*$", jobs_suffix) == ["privacy-governed-outcome-memory"], "candidate workflow job set drift")
          job_body = jobs_suffix.split("  privacy-governed-outcome-memory:\n", 1)[1]
          job_metadata = [line for line in job_body.splitlines() if re.match(r"^    \S", line)]
          require(job_metadata == ["    name: k6-r4-privacy-governed-outcome-memory", "    runs-on: ubuntu-latest", "    timeout-minutes: 30", "    env:", "    steps:"], "candidate job-level metadata/control surface drift")

          env_match = re.search(r"(?ms)^    env:\n(.*?)^    steps:\n", workflow)
          require(env_match is not None, "candidate workflow job env block missing")
          env_lines = [line.strip() for line in env_match.group(1).splitlines() if line.strip()]
          static_env = {
              'K6_R4_IMPLEMENTATION_BRANCH: "feat/k6-r4-privacy-governed-outcome-memory"', 'PRE_R4_INDEX_BLOB: "f5f5c68de90e23ad07af4a0489cf85e57fe46cfe"',
              'R3_AUTHORIZATION_BLOB: "b7c68a4e963a0d082fd966b2cfdab44095d107dd"', 'R3_WORKFLOW_BLOB: "7fdf087cab22719485b9aadd98568f9669cf3be1"',
              'R1_SCHEMA_BLOB: "336b5477b16f1bba5c4173874d819091cea9495d"', 'R3_SCHEMA_BLOB: "70125dfeead8fa18ae7bddc909d611e92b5b1873"',
              'R1_CONTRACTS_BLOB: "dc29c4ce85340312f28b67604cac01c1d775e370"', 'R3_CONTRACTS_BLOB: "eb49af7282ba9c60ac2d874dd71798867e39284e"',
              'R3_MATERIALIZER_BLOB: "7349d8d84f698aced133d5932dae910bc01deb9b"', 'R1_TEST_BLOB: "974137a513f16c93336d5bcda38c351326c53255"',
              'R3_TEST_BLOB: "9f79a44d8def5f04b943f9d4e7c87deba15bf61f"', 'CANONICAL_PROVENANCE_VALIDATOR_BLOB: "e312be037d5a7e4d6645b7056cb948486d035848"',
              'RULESET_TRUSTED_SNAPSHOT_UPDATED_AT: "2026-08-11T21:30:21.316+03:00"', 'RULESET_TRUSTED_NODE_ID: "RRS_lACqUmVwb3NpdG9yec5NVN5LzgE7-Js"', 'PYTHONDONTWRITEBYTECODE: "1"',
          }
          base_commit = api_json(f"/repos/{REPOSITORY}/git/commits/{event_base_sha}")
          base_tree = base_commit.get("tree", {}).get("sha")
          require(isinstance(base_tree, str) and SHA_RE.fullmatch(base_tree) is not None, "event base tree unavailable")
          dynamic_env = {f'K6_R4_AUTHORIZATION_MERGE_SHA: "{event_base_sha}"', f'K6_R4_AUTHORIZATION_MERGE_TREE: "{base_tree}"', f'K6_R4_AUTHORIZATION_DOCUMENT_BLOB: "{replacement_blob}"'}
          require(set(env_lines) == static_env | dynamic_env and len(env_lines) == len(set(env_lines)), "candidate workflow job env key/value set drift")

          named_blocks = inspect_steps(workflow)
          step_hashes = manifest["required_named_step_sha256"]
          require(isinstance(step_hashes, dict) and list(step_hashes) == NAMED_STEPS, "replacement manifest named-step hash scope invalid")
          for name in NAMED_STEPS:
              expected_hash = step_hashes[name]
              require(isinstance(expected_hash, str) and SHA256_RE.fullmatch(expected_hash) is not None, "replacement manifest named-step hash invalid")
              require(hashlib.sha256(named_blocks[name].encode("utf-8")).hexdigest() == expected_hash, "candidate protected named-step block drift")
          stripped = {line.strip() for line in workflow.splitlines() if line.strip() and not line.lstrip().startswith("#")}
          for line in REQUIRED_EXECUTABLE_LINES:
              require(line in stripped, "candidate workflow mandatory executable command missing")
          for fragment in string_list(manifest["required_workflow_fragments"], "required workflow fragments", minimum=4):
              require(fragment in workflow, "candidate workflow required protected fragment missing")
          for fragment in string_list(manifest["forbidden_workflow_fragments"], "forbidden workflow fragments"):
              require(fragment not in workflow, "candidate workflow contains protected forbidden fragment")

          contracts, runtime = candidate_text[R4_CONTRACTS_PATH], candidate_text[R4_RUNTIME_PATH]
          imports = re.findall(r"\bimport(?:\s+type)?[\s\S]*?\sfrom\s+[\"']([^\"']+)[\"']", runtime)
          require(len(re.findall(r"\bimport\b", contracts)) == 0, "R4 contracts gained imports")
          require(len(re.findall(r"\bimport\b", runtime)) == len(imports) and imports == ["node:crypto", "node:util", "./contracts.ts", "./outcome-linkage-contracts.ts"] and re.search(r"\bimport\s*\(", runtime) is None, "R4 runtime import allowlist drift")
          combined = contracts + "\n" + runtime
