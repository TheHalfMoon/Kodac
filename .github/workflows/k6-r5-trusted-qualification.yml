name: k6-r5-trusted-qualification

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/k6-r5-bounded-strategy-qualification.yml"
      - "schema/k6-r5-bounded-strategy-proposal.schema.json"
      - "packages/kodac-runtime/src/evidence-router/strategy-proposal-contracts.ts"
      - "packages/kodac-runtime/src/evidence-router/strategy-proposal.ts"
      - "packages/kodac-runtime/src/index.ts"
      - "packages/kodac-runtime/test/k6-r5-bounded-strategy-proposal.test.ts"

permissions:
  contents: read

jobs:
  trusted-r5-qualification:
    name: k6-r5-trusted-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENT_REPOSITORY: ${{ github.repository }}
      EVENT_PR_NUMBER: ${{ github.event.number }}
      EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.sha }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Inspect exact R5 candidate as untrusted data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          REPOSITORY = "TheHalfMoon/Kodac"
          TOKEN = os.environ.get("READ_ONLY_GITHUB_TOKEN", "")
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")

          AUTHORIZATION_MERGE_SHA = "31f5f9f3e05dd0feeda2b96b3221374c4bfe0032"
          AUTHORIZATION_MERGE_TREE = "8f319e2e4238ffdcbd91dd6651a90e90c88abedb"
          AUTHORIZATION_PATH = "docs/planning/KODAC_K6_R5_BOUNDED_STRATEGY_PROPOSAL_AND_QUALIFICATION_AUTHORIZATION_2026-08-27.md"
          AUTHORIZATION_BLOB = "8747754cc8563f2506869393221a4dac084e4805"

          STAGE_A_PR_NUMBER = 225
          STAGE_A_HEAD_SHA = "0d004e51732ca10c67eae7305bd291898257053e"
          STAGE_A_MERGE_SHA = "76f8639a329d9f168fea9d71f78711d612075619"
          STAGE_A_MERGE_TREE = "03041afd20e677992e57b7210cd20bd804539ab0"
          STAGE_A_TRUSTED_WORKFLOW_BLOB = "fbbb2a6f61d2b6e1d7390eebb85338bc467df6fb"

          REPAIR_AUTH_PR_NUMBER = 227
          REPAIR_AUTH_HEAD_SHA = "283f9b8f556984c5c0b92d5a746ed56f114c8582"
          REPAIR_AUTH_MERGE_SHA = "06f2dc2df5eb432107313932a16079edc4912a38"
          REPAIR_AUTH_MERGE_TREE = "4f325ce4b3c6aff664849dc33db7e2d9ff6e2954"
          REPAIR_AUTH_PATH = "docs/planning/KODAC_K6_R5_TRUSTED_QUALIFICATION_RULESET_OBSERVABILITY_REPAIR_AUTHORIZATION_2026-08-27.md"
          REPAIR_AUTH_BLOB = "e01639b284a9788d0cd1118c0ffd998271a087f0"

          TRUSTED_REPAIR_PR_NUMBER = 228
          TRUSTED_REPAIR_BRANCH = "ci/k6-r5-trusted-qualification-observability-repair"
          TRUSTED_REPAIR_HEAD_SHA = "e7c0c09d8f053b38b97b5570c15fecbc0bbff052"
          TRUSTED_REPAIR_MERGE_SHA = "0c151b3db8ab1487c5fcf1553060b4743ede155d"
          TRUSTED_REPAIR_MERGE_TREE = "dbd3a571ebc4e4adaf91c911dfa5763fd7636039"
          TRUSTED_REPAIR_WORKFLOW_BLOB = "9abba1ba237609908ad33afa2e9968e32c64a65c"

          PIN_AUTH_PR_NUMBER = 232
          PIN_AUTH_BRANCH = "docs/k6-r5-stage-b-split-proof-pin-amendment"
          PIN_AUTH_HEAD_SHA = "328b602dbc86636bfa83da3e219ed010ddbc9cf1"
          PIN_AUTH_MERGE_SHA = "2d4393fd08329507385fe06d90c3ddedff77bad9"
          PIN_AUTH_MERGE_TREE = "dff0d45e689dd211bc6aff8840b6d38c10888e9c"
          PIN_AUTH_PATH = "docs/planning/KODAC_K6_R5_STAGE_B_SPLIT_PROOF_PIN_AMENDMENT_AUTHORIZATION_2026-08-27.md"
          PIN_AUTH_BLOB = "3488478717e4b5d9163e786395ec04676c259657"

          PIN_REPAIR_PR_NUMBER = 233
          PIN_REPAIR_BRANCH = "ci/k6-r5-stage-b-split-proof-pin-repair"
          TRUSTED_WORKFLOW_PATH = ".github/workflows/k6-r5-trusted-qualification.yml"

          STAGE_B_PR_NUMBER = 226
          STAGE_B_BRANCH = "feat/k6-r5-bounded-strategy-proposal"
          STAGE_B_WORKFLOW_PATH = ".github/workflows/k6-r5-bounded-strategy-qualification.yml"
          STAGE_B_SCHEMA_PATH = "schema/k6-r5-bounded-strategy-proposal.schema.json"
          STAGE_B_CONTRACTS_PATH = "packages/kodac-runtime/src/evidence-router/strategy-proposal-contracts.ts"
          STAGE_B_RUNTIME_PATH = "packages/kodac-runtime/src/evidence-router/strategy-proposal.ts"
          STAGE_B_INDEX_PATH = "packages/kodac-runtime/src/index.ts"
          STAGE_B_TEST_PATH = "packages/kodac-runtime/test/k6-r5-bounded-strategy-proposal.test.ts"

          STAGE_B_PATH_ORDER = [
              STAGE_B_WORKFLOW_PATH,
              STAGE_B_SCHEMA_PATH,
              STAGE_B_CONTRACTS_PATH,
              STAGE_B_RUNTIME_PATH,
              STAGE_B_INDEX_PATH,
              STAGE_B_TEST_PATH,
          ]
          EXPECTED_PATH_STATUS = {
              STAGE_B_WORKFLOW_PATH: "added",
              STAGE_B_SCHEMA_PATH: "added",
              STAGE_B_CONTRACTS_PATH: "added",
              STAGE_B_RUNTIME_PATH: "added",
              STAGE_B_INDEX_PATH: "modified",
              STAGE_B_TEST_PATH: "added",
          }
          EXPECTED_PATHS = sorted(EXPECTED_PATH_STATUS)

          RULESET_ID = 20707483
          RULESET_NODE_ID = "RRS_lACqUmVwb3NpdG9yec5NVN5LzgE7-Js"
          RULESET_UPDATED_AT = "2026-08-11T21:30:21.316+03:00"
          PRE_R5_INDEX_BLOB = "74b9d62501ffce8f2cb053e3b72827de11c203d9"
          PREDECESSOR_BLOBS = {
              "packages/kodac-runtime/src/evidence-router/contracts.ts": "dc29c4ce85340312f28b67604cac01c1d775e370",
              "packages/kodac-runtime/src/evidence-router/route-plan-contracts.ts": "4ee85d8c0163d5318d0d900d733ba75afa814f7c",
              "packages/kodac-runtime/src/evidence-router/outcome-memory-contracts.ts": "6411a42e6fc0074e60edc10eaa27e00b3b197fca",
              "packages/kodac-runtime/src/evidence-router/outcome-memory.ts": "9f9d0769c5ffab2d482574ea59418144d6dc49a6",
          }

          EXPECTED_RUN_SHA256 = {
              "Attest exact head, authorization, six-path scope, predecessor pins, and immutable Actions": "edf519e39311133151b5a13830ca1b6b26ec375a8358158b7589d051918a27ca",
              "Sync locked validation environment outside the checkout": "288ae30bbb3ccc1c71de1a69bbc5d0f899237dadd71b7c66dba026edcf6323a3",
              "Validate R5 schema/runtime parity and closed vocabularies": "e6760c1cfe96344a4429ba1f8a9e4deaab4fb3025c29646a96bad9346eb95082",
              "Recompute R5 fixture strategy, trial-set, and qualification corpus identities": "1a53aaa2bd8335c26dcde5a0c489b41731ab5a8e1f69dfe08edc7617161b6e41",
              "Prove forbidden R5 authority surfaces and live ruleset": "b3ca1a533889b0c7feed3806a50466f2ccb72a514e3ae129adb4c47a85c9f726",
              "Install integrity-locked TypeScript validation tooling outside the checkout": "4b8ee02309647b7e4f023e874574f5c971573a4a8336daa7b972f7bf3ec0b125",
              "Run strict TypeScript, focused R5/adversarial/predecessor tests, full runtime, Python, Ruff, and provenance gates": "046f5bd1ec60241cd04d92b911ebe27f52fd659f6cf8aad353532b6a01f053c9",
              "Remove ephemeral TypeScript validation tooling": "7d7717cbae28f3c319b74d96168c76464c8e5064e8aca1827b919081cafbe748",
              "Attest checkout unchanged after K6-R5 validation": "1d9d18c40564400c5655731ecbc792fae7261d6c66ddf4779bb678a3afbb93e5",
          }

          def fail(label: str) -> None:
              raise SystemExit(f"K6-R5 trusted qualification failed: {label}")

          def require(condition: bool, label: str) -> None:
              if not condition:
                  fail(label)

          def event_value(name: str) -> str:
              value = os.environ.get(name, "")
              require(bool(value), f"missing event field {name}")
              return value

          def unique_object(pairs: list[tuple[str, object]]) -> dict:
              value: dict[str, object] = {}
              for key, item in pairs:
                  require(key not in value, "JSON object contains duplicate keys")
                  value[key] = item
              return value

          def api_json(path: str) -> dict:
              require(path.startswith("/repos/TheHalfMoon/Kodac/"), "GitHub API path escaped repository boundary")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "kodac-k6-r5-trusted-qualification",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = response.read(8_000_001)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  fail("read-only GitHub API request failed")
              require(len(payload) <= 8_000_000, "GitHub API response exceeds inspector bound")
              try:
                  value = json.loads(payload, object_pairs_hook=unique_object)
              except SystemExit:
                  raise
              except Exception:
                  fail("GitHub API response is not valid JSON")
              require(isinstance(value, dict), "GitHub API response has unexpected shape")
              return value

          def compare(base: str, head: str) -> dict:
              require(SHA_RE.fullmatch(base) is not None and SHA_RE.fullmatch(head) is not None, "compare refs are not immutable SHAs")
              return api_json(f"/repos/{REPOSITORY}/compare/{base}...{head}")

          def file_at(ref: str, path: str) -> tuple[str, str]:
              require(SHA_RE.fullmatch(ref) is not None, "file ref is not an immutable SHA")
              value = api_json(f"/repos/{REPOSITORY}/contents/{urllib.parse.quote(path, safe='/')}?ref={ref}")
              blob = value.get("sha")
              require(isinstance(blob, str) and SHA_RE.fullmatch(blob) is not None, "file blob identity unavailable")
              require(value.get("encoding") == "base64" and isinstance(value.get("content"), str), "file content encoding unexpected")
              try:
                  raw = base64.b64decode(value["content"], validate=False)
                  text = raw.decode("utf-8", "strict")
              except Exception:
                  fail("file content decode failed")
              require(len(raw) <= 2_000_000, "file content exceeds inspector bound")
              return text, blob

          def parse_instant(value: object) -> datetime:
              require(isinstance(value, str) and bool(value), "ruleset timestamp missing")
              normalized = value[:-1] + "+00:00" if value.endswith("Z") else value
              try:
                  parsed = datetime.fromisoformat(normalized)
              except ValueError:
                  fail("ruleset timestamp invalid")
              require(parsed.tzinfo is not None and parsed.utcoffset() is not None, "ruleset timestamp lacks timezone")
              return parsed.astimezone(timezone.utc)

          def github_expression(body: str) -> str:
              return "$" + "{{ " + body + " }}"

          # The trusted workflow is qualified by exact-head external review and protected-main
          # governance before merge. Once canonical, this base-controlled file is the trust
          # anchor; it intentionally does not attempt circular self-authentication.
          repository = event_value("EVENT_REPOSITORY")
          pr_number = event_value("EVENT_PR_NUMBER")
          base_ref = event_value("EVENT_BASE_REF")
          base_sha = event_value("EVENT_BASE_SHA")
          head_ref = event_value("EVENT_HEAD_REF")
          head_sha = event_value("EVENT_HEAD_SHA")
          head_repository = event_value("EVENT_HEAD_REPOSITORY")
          workflow_sha = event_value("EVENT_WORKFLOW_SHA")

          require(TOKEN != "", "GitHub token unavailable")
          require(repository == REPOSITORY, "repository mismatch")
          require(pr_number.isdigit() and int(pr_number) == STAGE_B_PR_NUMBER, "Stage B PR identity mismatch")
          require(base_ref == "main", "base branch mismatch")
          require(head_ref == STAGE_B_BRANCH, "candidate branch mismatch")
          require(head_repository == REPOSITORY, "candidate repository mismatch")
          require(SHA_RE.fullmatch(base_sha) is not None and SHA_RE.fullmatch(head_sha) is not None, "event SHA invalid")
          require(base_sha != head_sha, "base/head identity collision")
          require(workflow_sha == base_sha, "workflow did not execute from protected base")

          live_pr = api_json(f"/repos/{REPOSITORY}/pulls/{STAGE_B_PR_NUMBER}")
          require(
              live_pr.get("number") == STAGE_B_PR_NUMBER
              and live_pr.get("state") == "open"
              and live_pr.get("draft") is False
              and live_pr.get("head", {}).get("sha") == head_sha
              and live_pr.get("head", {}).get("ref") == STAGE_B_BRANCH
              and live_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY
              and live_pr.get("base", {}).get("ref") == "main"
              and live_pr.get("base", {}).get("sha") == base_sha,
              "live Stage B PR identity mismatch",
          )
          live_main = api_json(f"/repos/{REPOSITORY}/git/ref/heads/main").get("object", {}).get("sha")
          require(live_main == base_sha, "protected main moved during qualification")

          authorization_merge = api_json(f"/repos/{REPOSITORY}/git/commits/{AUTHORIZATION_MERGE_SHA}")
          require(
              authorization_merge.get("tree", {}).get("sha") == AUTHORIZATION_MERGE_TREE
              and authorization_merge.get("verification", {}).get("verified") is True
              and authorization_merge.get("verification", {}).get("reason") == "valid",
              "original R5 authorization merge identity invalid",
          )
          require(file_at(AUTHORIZATION_MERGE_SHA, AUTHORIZATION_PATH)[1] == AUTHORIZATION_BLOB, "original R5 authorization blob drift")
          require(file_at(base_sha, AUTHORIZATION_PATH)[1] == AUTHORIZATION_BLOB, "original R5 authorization not preserved")

          stage_a_pr = api_json(f"/repos/{REPOSITORY}/pulls/{STAGE_A_PR_NUMBER}")
          require(
              stage_a_pr.get("merged") is True
              and stage_a_pr.get("base", {}).get("sha") == AUTHORIZATION_MERGE_SHA
              and stage_a_pr.get("head", {}).get("sha") == STAGE_A_HEAD_SHA
              and stage_a_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY
              and stage_a_pr.get("changed_files") == 1
              and stage_a_pr.get("merge_commit_sha") == STAGE_A_MERGE_SHA,
              "Stage A PR identity invalid",
          )
          stage_a_merge = api_json(f"/repos/{REPOSITORY}/git/commits/{STAGE_A_MERGE_SHA}")
          stage_a_parents = stage_a_merge.get("parents", [])
          require(
              stage_a_merge.get("tree", {}).get("sha") == STAGE_A_MERGE_TREE
              and stage_a_merge.get("verification", {}).get("verified") is True
              and stage_a_merge.get("verification", {}).get("reason") == "valid"
              and len(stage_a_parents) == 2
              and stage_a_parents[0].get("sha") == AUTHORIZATION_MERGE_SHA
              and stage_a_parents[1].get("sha") == STAGE_A_HEAD_SHA,
              "Stage A merge identity invalid",
          )
          stage_a_compare = compare(AUTHORIZATION_MERGE_SHA, STAGE_A_HEAD_SHA)
          stage_a_files = stage_a_compare.get("files", [])
          require(
              stage_a_compare.get("merge_base_commit", {}).get("sha") == AUTHORIZATION_MERGE_SHA
              and stage_a_compare.get("behind_by") == 0
              and stage_a_compare.get("ahead_by", 0) > 0
              and len(stage_a_files) == 1
              and stage_a_files[0].get("filename") == TRUSTED_WORKFLOW_PATH
              and stage_a_files[0].get("status") == "added"
              and stage_a_files[0].get("previous_filename") in (None, "")
              and stage_a_files[0].get("sha") == STAGE_A_TRUSTED_WORKFLOW_BLOB,
              "Stage A trusted-workflow scope invalid",
          )
          require(file_at(STAGE_A_HEAD_SHA, TRUSTED_WORKFLOW_PATH)[1] == STAGE_A_TRUSTED_WORKFLOW_BLOB, "Stage A head workflow blob drift")
          require(file_at(STAGE_A_MERGE_SHA, TRUSTED_WORKFLOW_PATH)[1] == STAGE_A_TRUSTED_WORKFLOW_BLOB, "Stage A merge workflow blob drift")

          repair_auth_pr = api_json(f"/repos/{REPOSITORY}/pulls/{REPAIR_AUTH_PR_NUMBER}")
          require(
              repair_auth_pr.get("merged") is True
              and repair_auth_pr.get("base", {}).get("sha") == STAGE_A_MERGE_SHA
              and repair_auth_pr.get("head", {}).get("sha") == REPAIR_AUTH_HEAD_SHA
              and repair_auth_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY
              and repair_auth_pr.get("changed_files") == 1
              and repair_auth_pr.get("merge_commit_sha") == REPAIR_AUTH_MERGE_SHA,
              "repair authorization PR identity invalid",
          )
          repair_auth_merge = api_json(f"/repos/{REPOSITORY}/git/commits/{REPAIR_AUTH_MERGE_SHA}")
          repair_auth_parents = repair_auth_merge.get("parents", [])
          require(
              repair_auth_merge.get("tree", {}).get("sha") == REPAIR_AUTH_MERGE_TREE
              and repair_auth_merge.get("verification", {}).get("verified") is True
              and repair_auth_merge.get("verification", {}).get("reason") == "valid"
              and len(repair_auth_parents) == 2
              and repair_auth_parents[0].get("sha") == STAGE_A_MERGE_SHA
              and repair_auth_parents[1].get("sha") == REPAIR_AUTH_HEAD_SHA,
              "repair authorization merge identity invalid",
          )
          require(file_at(REPAIR_AUTH_MERGE_SHA, REPAIR_AUTH_PATH)[1] == REPAIR_AUTH_BLOB, "repair authorization blob drift")
          require(file_at(base_sha, REPAIR_AUTH_PATH)[1] == REPAIR_AUTH_BLOB, "repair authorization not preserved")
          require(file_at(REPAIR_AUTH_MERGE_SHA, TRUSTED_WORKFLOW_PATH)[1] == STAGE_A_TRUSTED_WORKFLOW_BLOB, "pre-repair trusted workflow drift")

          trusted_repair_pr = api_json(f"/repos/{REPOSITORY}/pulls/{TRUSTED_REPAIR_PR_NUMBER}")
          require(
              trusted_repair_pr.get("merged") is True
              and trusted_repair_pr.get("base", {}).get("sha") == REPAIR_AUTH_MERGE_SHA
              and trusted_repair_pr.get("head", {}).get("sha") == TRUSTED_REPAIR_HEAD_SHA
              and trusted_repair_pr.get("head", {}).get("ref") == TRUSTED_REPAIR_BRANCH
              and trusted_repair_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY
              and trusted_repair_pr.get("changed_files") == 1
              and trusted_repair_pr.get("merge_commit_sha") == TRUSTED_REPAIR_MERGE_SHA,
              "trusted repair PR identity invalid",
          )
          trusted_repair_merge = api_json(f"/repos/{REPOSITORY}/git/commits/{TRUSTED_REPAIR_MERGE_SHA}")
          trusted_repair_parents = trusted_repair_merge.get("parents", [])
          trusted_repair_head = api_json(f"/repos/{REPOSITORY}/git/commits/{TRUSTED_REPAIR_HEAD_SHA}")
          require(
              trusted_repair_merge.get("tree", {}).get("sha") == TRUSTED_REPAIR_MERGE_TREE
              and trusted_repair_merge.get("tree", {}).get("sha") == trusted_repair_head.get("tree", {}).get("sha")
              and trusted_repair_merge.get("verification", {}).get("verified") is True
              and trusted_repair_merge.get("verification", {}).get("reason") == "valid"
              and len(trusted_repair_parents) == 2
              and trusted_repair_parents[0].get("sha") == REPAIR_AUTH_MERGE_SHA
              and trusted_repair_parents[1].get("sha") == TRUSTED_REPAIR_HEAD_SHA,
              "trusted repair merge identity invalid",
          )
          trusted_repair_compare = compare(REPAIR_AUTH_MERGE_SHA, TRUSTED_REPAIR_HEAD_SHA)
          trusted_repair_files = trusted_repair_compare.get("files", [])
          require(
              trusted_repair_compare.get("merge_base_commit", {}).get("sha") == REPAIR_AUTH_MERGE_SHA
              and trusted_repair_compare.get("behind_by") == 0
              and trusted_repair_compare.get("ahead_by", 0) > 0
              and len(trusted_repair_files) == 1
              and trusted_repair_files[0].get("filename") == TRUSTED_WORKFLOW_PATH
              and trusted_repair_files[0].get("status") == "modified"
              and trusted_repair_files[0].get("previous_filename") in (None, "")
              and trusted_repair_files[0].get("sha") == TRUSTED_REPAIR_WORKFLOW_BLOB,
              "trusted repair scope invalid",
          )
          require(file_at(TRUSTED_REPAIR_HEAD_SHA, TRUSTED_WORKFLOW_PATH)[1] == TRUSTED_REPAIR_WORKFLOW_BLOB, "trusted repair head workflow blob drift")
          require(file_at(TRUSTED_REPAIR_MERGE_SHA, TRUSTED_WORKFLOW_PATH)[1] == TRUSTED_REPAIR_WORKFLOW_BLOB, "trusted repair merge workflow blob drift")

          pin_auth_pr = api_json(f"/repos/{REPOSITORY}/pulls/{PIN_AUTH_PR_NUMBER}")
          require(
              pin_auth_pr.get("merged") is True
              and pin_auth_pr.get("base", {}).get("sha") == TRUSTED_REPAIR_MERGE_SHA
              and pin_auth_pr.get("head", {}).get("sha") == PIN_AUTH_HEAD_SHA
              and pin_auth_pr.get("head", {}).get("ref") == PIN_AUTH_BRANCH
              and pin_auth_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY
              and pin_auth_pr.get("changed_files") == 1
              and pin_auth_pr.get("merge_commit_sha") == PIN_AUTH_MERGE_SHA,
              "pin authorization PR identity invalid",
          )
          pin_auth_merge = api_json(f"/repos/{REPOSITORY}/git/commits/{PIN_AUTH_MERGE_SHA}")
          pin_auth_parents = pin_auth_merge.get("parents", [])
          pin_auth_head = api_json(f"/repos/{REPOSITORY}/git/commits/{PIN_AUTH_HEAD_SHA}")
          require(
              pin_auth_merge.get("tree", {}).get("sha") == PIN_AUTH_MERGE_TREE
              and pin_auth_merge.get("tree", {}).get("sha") == pin_auth_head.get("tree", {}).get("sha")
              and pin_auth_merge.get("verification", {}).get("verified") is True
              and pin_auth_merge.get("verification", {}).get("reason") == "valid"
              and len(pin_auth_parents) == 2
              and pin_auth_parents[0].get("sha") == TRUSTED_REPAIR_MERGE_SHA
              and pin_auth_parents[1].get("sha") == PIN_AUTH_HEAD_SHA,
              "pin authorization merge identity invalid",
          )
          pin_auth_compare = compare(TRUSTED_REPAIR_MERGE_SHA, PIN_AUTH_HEAD_SHA)
          pin_auth_files = pin_auth_compare.get("files", [])
          require(
              pin_auth_compare.get("merge_base_commit", {}).get("sha") == TRUSTED_REPAIR_MERGE_SHA
              and pin_auth_compare.get("behind_by") == 0
              and pin_auth_compare.get("ahead_by", 0) > 0
              and len(pin_auth_files) == 1
              and pin_auth_files[0].get("filename") == PIN_AUTH_PATH
              and pin_auth_files[0].get("status") == "added"
              and pin_auth_files[0].get("previous_filename") in (None, "")
              and pin_auth_files[0].get("sha") == PIN_AUTH_BLOB,
              "pin authorization scope invalid",
          )
          require(file_at(PIN_AUTH_HEAD_SHA, PIN_AUTH_PATH)[1] == PIN_AUTH_BLOB, "pin authorization head blob drift")
          require(file_at(PIN_AUTH_MERGE_SHA, PIN_AUTH_PATH)[1] == PIN_AUTH_BLOB, "pin authorization merge blob drift")
          require(file_at(PIN_AUTH_MERGE_SHA, TRUSTED_WORKFLOW_PATH)[1] == TRUSTED_REPAIR_WORKFLOW_BLOB, "trusted workflow drift before Unit B")

          require(PIN_REPAIR_PR_NUMBER > 0, "Unit B PR registration unavailable")
          pin_repair_pr = api_json(f"/repos/{REPOSITORY}/pulls/{PIN_REPAIR_PR_NUMBER}")
          require(
              pin_repair_pr.get("merged") is True
              and pin_repair_pr.get("base", {}).get("sha") == PIN_AUTH_MERGE_SHA
              and pin_repair_pr.get("head", {}).get("ref") == PIN_REPAIR_BRANCH
              and pin_repair_pr.get("head", {}).get("repo", {}).get("full_name") == REPOSITORY
              and pin_repair_pr.get("changed_files") == 1
              and pin_repair_pr.get("merge_commit_sha") == base_sha,
              "Unit B repair PR identity invalid",
          )
          pin_repair_head_sha = pin_repair_pr.get("head", {}).get("sha")
          require(isinstance(pin_repair_head_sha, str) and SHA_RE.fullmatch(pin_repair_head_sha) is not None, "Unit B repair head unavailable")
          pin_repair_merge = api_json(f"/repos/{REPOSITORY}/git/commits/{base_sha}")
          pin_repair_parents = pin_repair_merge.get("parents", [])
          pin_repair_head = api_json(f"/repos/{REPOSITORY}/git/commits/{pin_repair_head_sha}")
          require(
              pin_repair_merge.get("verification", {}).get("verified") is True
              and pin_repair_merge.get("verification", {}).get("reason") == "valid"
              and len(pin_repair_parents) == 2
              and pin_repair_parents[0].get("sha") == PIN_AUTH_MERGE_SHA
              and pin_repair_parents[1].get("sha") == pin_repair_head_sha
              and pin_repair_merge.get("tree", {}).get("sha") == pin_repair_head.get("tree", {}).get("sha"),
              "Unit B repair merge identity invalid",
          )
          pin_repair_compare = compare(PIN_AUTH_MERGE_SHA, pin_repair_head_sha)
          pin_repair_files = pin_repair_compare.get("files", [])
          require(
              pin_repair_compare.get("merge_base_commit", {}).get("sha") == PIN_AUTH_MERGE_SHA
              and pin_repair_compare.get("behind_by") == 0
              and pin_repair_compare.get("ahead_by", 0) > 0
              and len(pin_repair_files) == 1
              and pin_repair_files[0].get("filename") == TRUSTED_WORKFLOW_PATH
              and pin_repair_files[0].get("status") == "modified"
              and pin_repair_files[0].get("previous_filename") in (None, ""),
              "Unit B repair scope invalid",
          )
          base_workflow_text, base_workflow_blob = file_at(base_sha, TRUSTED_WORKFLOW_PATH)
          pin_repair_head_text, pin_repair_head_blob = file_at(pin_repair_head_sha, TRUSTED_WORKFLOW_PATH)
          require(
              base_workflow_text == pin_repair_head_text
              and base_workflow_blob == pin_repair_head_blob
              and pin_repair_files[0].get("sha") == base_workflow_blob
              and base_workflow_blob != TRUSTED_REPAIR_WORKFLOW_BLOB,
              "Unit B repair workflow identity invalid",
          )

          for path, expected_blob in PREDECESSOR_BLOBS.items():
              require(file_at(base_sha, path)[1] == expected_blob, f"predecessor drift: {path}")
          require(file_at(base_sha, STAGE_B_INDEX_PATH)[1] == PRE_R5_INDEX_BLOB, "pre-R5 index drift")

          candidate_compare = compare(base_sha, head_sha)
          candidate_files = candidate_compare.get("files", [])
          require(
              candidate_compare.get("merge_base_commit", {}).get("sha") == base_sha
              and candidate_compare.get("behind_by") == 0
              and candidate_compare.get("ahead_by", 0) > 0
              and len(candidate_files) == 6,
              "Stage B candidate scope invalid",
          )
          seen: dict[str, str] = {}
          for item in candidate_files:
              path = item.get("filename")
              require(
                  path in EXPECTED_PATH_STATUS
                  and path not in seen
                  and item.get("status") == EXPECTED_PATH_STATUS[path]
                  and item.get("previous_filename") in (None, ""),
                  "Stage B candidate path/status invalid",
              )
              seen[path] = item.get("sha")
          require(sorted(seen) == EXPECTED_PATHS, "Stage B candidate paths invalid")

          candidate_workflow, candidate_workflow_blob = file_at(head_sha, STAGE_B_WORKFLOW_PATH)
          require(candidate_workflow_blob == seen[STAGE_B_WORKFLOW_PATH], "Stage B candidate workflow blob mismatch")

          expected_preamble = (
              "name: k6-r5-bounded-strategy-qualification\n\n"
              "on:\n"
              "  pull_request:\n"
              "    branches:\n"
              "      - main\n"
              "    paths:\n"
              + "".join(f'      - "{path}"\n' for path in STAGE_B_PATH_ORDER)
              + "\npermissions:\n"
              "  contents: read\n\n"
              "jobs:\n"
              "  bounded-strategy-qualification:\n"
          )
          require(
              candidate_workflow.startswith(expected_preamble)
              and re.findall(r"(?m)^([A-Za-z][A-Za-z0-9_-]*):", candidate_workflow) == ["name", "on", "permissions", "jobs"],
              "Stage B workflow preamble invalid",
          )
          for forbidden in [
              "pull_request_target:",
              "workflow_dispatch:",
              "schedule:",
              "contents: write",
              "actions: write",
              "pull-requests: write",
              "id-token:",
              "continue-on-error:",
              "|| true",
              "GITHUB_ENV",
              "GITHUB_PATH",
          ]:
              require(forbidden not in candidate_workflow, f"Stage B workflow forbidden surface: {forbidden}")

          job = candidate_workflow.split("  bounded-strategy-qualification:\n", 1)[1]
          require(
              [line for line in job.splitlines() if re.match(r"^    \S", line)]
              == [
                  "    name: k6-r5-bounded-strategy-qualification",
                  "    runs-on: ubuntu-latest",
                  "    timeout-minutes: 30",
                  "    env:",
                  "    steps:",
              ],
              "Stage B workflow job surface invalid",
          )
          env_match = re.search(r"(?ms)^    env:\n(.*?)^    steps:\n", candidate_workflow)
          require(env_match is not None, "Stage B workflow env missing")
          actual_env = {line.strip() for line in env_match.group(1).splitlines() if line.strip()}
          expected_env = {
              f'K6_R5_AUTHORIZATION_MERGE_SHA: "{AUTHORIZATION_MERGE_SHA}"',
              f'K6_R5_AUTHORIZATION_MERGE_TREE: "{AUTHORIZATION_MERGE_TREE}"',
              f'K6_R5_AUTHORIZATION_DOCUMENT_BLOB: "{AUTHORIZATION_BLOB}"',
              f'K6_R5_IMPLEMENTATION_BRANCH: "{STAGE_B_BRANCH}"',
              f'PRE_R5_INDEX_BLOB: "{PRE_R5_INDEX_BLOB}"',
              'PYTHONDONTWRITEBYTECODE: "1"',
              f'R1_CONTRACTS_BLOB: "{PREDECESSOR_BLOBS["packages/kodac-runtime/src/evidence-router/contracts.ts"]}"',
              f'R2_ROUTE_PLAN_CONTRACTS_BLOB: "{PREDECESSOR_BLOBS["packages/kodac-runtime/src/evidence-router/route-plan-contracts.ts"]}"',
              f'R4_OUTCOME_MEMORY_CONTRACTS_BLOB: "{PREDECESSOR_BLOBS["packages/kodac-runtime/src/evidence-router/outcome-memory-contracts.ts"]}"',
              f'R4_OUTCOME_MEMORY_RUNTIME_BLOB: "{PREDECESSOR_BLOBS["packages/kodac-runtime/src/evidence-router/outcome-memory.ts"]}"',
              f'K6_R5_TRUSTED_WORKFLOW_BLOB: "{base_workflow_blob}"',
          }
          require(actual_env == expected_env, "Stage B workflow environment drift")

          expected_metadata = {
              name: ["- name: " + name, "shell: bash", "run: |"]
              for name in EXPECTED_RUN_SHA256
          }
          expected_metadata["Attest exact head, authorization, six-path scope, predecessor pins, and immutable Actions"] = [
              "- name: Attest exact head, authorization, six-path scope, predecessor pins, and immutable Actions",
              "shell: bash",
              "env:",
              "PR_BASE_REF: " + github_expression("github.event.pull_request.base.ref"),
              "PR_BASE_SHA: " + github_expression("github.event.pull_request.base.sha"),
              "PR_HEAD_SHA: " + github_expression("github.event.pull_request.head.sha"),
              "PR_HEAD_REF: " + github_expression("github.event.pull_request.head.ref"),
              "PR_HEAD_REPOSITORY: " + github_expression("github.event.pull_request.head.repo.full_name"),
              "REPOSITORY: " + github_expression("github.repository"),
              "run: |",
          ]
          expected_metadata["Prove forbidden R5 authority surfaces and live ruleset"] = [
              "- name: Prove forbidden R5 authority surfaces and live ruleset",
              "shell: bash",
              "env:",
              "GH_TOKEN: " + github_expression("github.token"),
              "run: |",
          ]
          expected_metadata["Remove ephemeral TypeScript validation tooling"] = [
              "- name: Remove ephemeral TypeScript validation tooling",
              "if: " + github_expression("always()"),
              "shell: bash",
              "run: |",
          ]
          expected_metadata["Attest checkout unchanged after K6-R5 validation"] = [
              "- name: Attest checkout unchanged after K6-R5 validation",
              "if: " + github_expression("always()"),
              "shell: bash",
              "run: |",
          ]

          lines = candidate_workflow.splitlines()
          steps_markers = [index for index, line in enumerate(lines) if line == "    steps:"]
          require(len(steps_markers) == 1, "Stage B workflow steps marker invalid")
          positions = [
              index
              for index in range(steps_markers[0] + 1, len(lines))
              if re.match(r"^      - ", lines[index])
          ]
          positions.append(len(lines))
          run_bodies: dict[str, str] = {}
          action_blocks: list[list[str]] = []
          for start, end in zip(positions, positions[1:]):
              raw_block = lines[start:end]
              header = raw_block[0].strip()
              if header.startswith("- uses:"):
                  action_blocks.append([line.strip() for line in raw_block if line.strip()])
                  continue
              require(header.startswith("- name: "), "Stage B workflow step header invalid")
              name = header[8:]
              run_positions = [index for index, line in enumerate(raw_block) if line == "        run: |"]
              require(len(run_positions) == 1 and name in EXPECTED_RUN_SHA256, "Stage B workflow named run invalid")
              run_position = run_positions[0]
              require(
                  [line.strip() for line in raw_block[: run_position + 1] if line.strip()] == expected_metadata[name],
                  f"Stage B workflow metadata drift: {name}",
              )
              require(
                  all(not line.strip() or line.startswith("          ") for line in raw_block[run_position + 1 :]),
                  f"Stage B workflow run-body shape drift: {name}",
              )
              body_lines = [
                  line[10:] if line.startswith("          ") else ""
                  for line in raw_block[run_position + 1 :]
              ]
              while body_lines and body_lines[-1] == "":
                  body_lines.pop()
              run_bodies[name] = "\n".join(body_lines) + "\n"

          require(list(run_bodies) == list(EXPECTED_RUN_SHA256), "Stage B workflow named-run order drift")
          for name, expected_hash in EXPECTED_RUN_SHA256.items():
              actual_hash = hashlib.sha256(run_bodies[name].encode()).hexdigest()
              require(actual_hash == expected_hash, f"Stage B workflow run-body hash drift: {name}")

          require(
              action_blocks
              == [
                  [
                      "- uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
                      "with:",
                      "ref: " + github_expression("github.event.pull_request.head.sha"),
                      "persist-credentials: false",
                      "fetch-depth: 0",
                  ],
                  [
                      "- uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4",
                      "with:",
                      'node-version: "24.18.0"',
                  ],
                  [
                      "- uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6",
                      "with:",
                      'version: "0.12.1"',
                      "enable-cache: false",
                  ],
              ],
              "Stage B workflow immutable action pins drift",
          )

          ruleset = api_json(f"/repos/{REPOSITORY}/rulesets/{RULESET_ID}")
          require(
              ruleset.get("id") == RULESET_ID
              and ("node_id" not in ruleset or ruleset.get("node_id") == RULESET_NODE_ID)
              and parse_instant(ruleset.get("updated_at")) == parse_instant(RULESET_UPDATED_AT)
              and ruleset.get("name") == "Kodac canonical main protection v1"
              and ruleset.get("target") == "branch"
              and ruleset.get("enforcement") == "active"
              and ruleset.get("conditions", {}).get("ref_name") == {"exclude": [], "include": ["refs/heads/main"]},
              "ruleset visible identity drift",
          )
          if "source_type" in ruleset:
              require(ruleset.get("source_type") == "Repository", "ruleset source type drift")
          if "source" in ruleset:
              require(ruleset.get("source") == REPOSITORY, "ruleset source drift")

          bypass_actors_visible = "bypass_actors" in ruleset
          current_user_bypass_visible = "current_user_can_bypass" in ruleset
          if bypass_actors_visible:
              require(ruleset.get("bypass_actors") == [], "visible ruleset bypass actors drift")
          if current_user_bypass_visible:
              require(ruleset.get("current_user_can_bypass") == "never", "visible current-user bypass drift")

          rules = ruleset.get("rules")
          require(
              isinstance(rules, list)
              and [rule.get("type") for rule in rules]
              == ["deletion", "non_fast_forward", "pull_request", "required_status_checks"],
              "ruleset rule order drift",
          )
          pull_request_rule = rules[2].get("parameters", {})
          require(
              pull_request_rule
              == {
                  "required_approving_review_count": 0,
                  "dismiss_stale_reviews_on_push": False,
                  "required_reviewers": [],
                  "require_code_owner_review": False,
                  "require_last_push_approval": False,
                  "require_extra_approval_for_unattributed_changes": True,
                  "required_review_thread_resolution": True,
                  "allowed_merge_methods": ["merge", "squash", "rebase"],
              },
              "pull-request ruleset semantics drift",
          )
          status_parameters = rules[3].get("parameters", {})
          require(
              status_parameters.get("strict_required_status_checks_policy") is True
              and status_parameters.get("do_not_enforce_on_create") is False
              and status_parameters.get("required_status_checks")
              == [
                  {"context": "provenance", "integration_id": 15368},
                  {"context": "legacy-tests", "integration_id": 15368},
                  {"context": "k2-runtime-gate", "integration_id": 15368},
              ],
              "required-status-check ruleset semantics drift",
          )

          print(
              json.dumps(
                  {
                      "version": "kodac-k6-r5-trusted-inspector-proof-v3",
                      "proof_model": "protected-base-plus-external-review-and-owner-proof-v1",
                      "base_sha": base_sha,
                      "head_sha": head_sha,
                      "stage_b_pr": STAGE_B_PR_NUMBER,
                      "trusted_repair_pr": TRUSTED_REPAIR_PR_NUMBER,
                      "trusted_repair_head_sha": TRUSTED_REPAIR_HEAD_SHA,
                      "pin_authorization_pr": PIN_AUTH_PR_NUMBER,
                      "pin_authorization_merge_sha": PIN_AUTH_MERGE_SHA,
                      "pin_repair_pr": PIN_REPAIR_PR_NUMBER,
                      "pin_repair_head_sha": pin_repair_head_sha,
                      "trusted_workflow_blob": base_workflow_blob,
                      "candidate_workflow_blob": candidate_workflow_blob,
                      "bypass_state_visibility": (
                          "AVAILABLE"
                          if bypass_actors_visible and current_user_bypass_visible
                          else "UNAVAILABLE_UNDER_ACTIONS_TOKEN"
                      ),
                      "external_owner_no_bypass_proof_required": True,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          print("K6-R5 trusted workflow-visible qualification: PASS; owner-level no-bypass proof remains mandatory")
          PYCODE
