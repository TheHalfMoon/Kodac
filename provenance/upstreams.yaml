schema_version: 1
as_of: "2026-09-15"
canonical_base: 25e1a1b37417d18c14715faadc7c20579b039990
policy:
  code_import_authorized: false
  require_exact_commit: true
  require_component_license_review: true
  require_import_record: true
  require_behavioral_tests: true
  notes:
    - "These entries are discovery baselines, not authorization to import source code."
    - "Mixed-license repositories must be reviewed at path/component level."
    - "Founder-confirmed source-use rights remove a rights barrier only; they do not grant global import or canonical-adoption authority."
source_rights:
  state: founder_asserted_owner_permission
  asserted_on: "2026-08-12"
  rights_axis: founder_confirmed_not_a_general_blocker
  admission_axis: fail_closed_component_scoped_separately_authorized
  import_authority: none_by_implication
  notes:
    - "The founder asserts permission exists from the relevant source owners to use their source code as desired."
    - "Rights are not a blocker for separately authorized source mining."
    - "Exact source identity and revision remain required before intake."
    - "Engineering qualification, scoped import authorization, and canonical adoption remain separate gates."
admission_lifecycle:
  - RIGHTS_CONFIRMED
  - SOURCE_PINNED
  - AUDITED
  - BENCHMARKED
  - QUALIFIED
  - ADMITTED
  - CANONICALLY_ADOPTED

